<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>MyPrime · שירות לקוחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#3A332C; --muted:#8C8378; --line:#ECE4DA;
  --accent:#9B4A5E; --accent-soft:#F5E9EC;
  --ok:#3E7D5A; --ok-soft:#EAF3EC; --warn:#976A1C; --warn-soft:#F6EEDC;
  --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:19px}
.brand span{color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.who{font-size:13px;color:var(--muted)}
.who select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--card);color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:7px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 14px;border:1px solid var(--line);background:transparent;border-radius:11px;cursor:pointer;color:var(--muted);transition:.15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.topic.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:14px}
input[type=text]{width:100%;font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.soft{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:13px;padding:9px 14px}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:11px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:#F1EDE7;color:var(--muted)}
.answer{white-space:pre-wrap;font-size:15.5px;line-height:1.8;margin:12px 0 14px}
.meta{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warnbox{background:var(--warn-soft);color:var(--warn);font-size:13px;border-radius:11px;padding:9px 12px;margin:10px 0}
textarea{width:100%;min-height:70px;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card);color:var(--ink);line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.notes-head{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.notes-title{font-size:14px;font-weight:600}
.note{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px;font-size:13px}
.note .q{font-weight:600}
.note .n{color:var(--muted);margin-top:4px;white-space:pre-wrap}
.count{background:var(--accent);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.toast{position:fixed;inset-inline:0;bottom:20px;margin:auto;width:max-content;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
small.foot{display:block;text-align:center;color:var(--muted);font-size:11px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">My<span>Prime</span> · שירות לקוחות</div>
      <div class="sub" id="sub">טוען תשובות…</div>
    </div>
    <div class="who">משיבה: <select id="responder"><option>טלי</option><option>שיר</option><option>אפי</option><option>רון</option></select></div>
  </header>

  <div class="panel">
    <label class="lbl">סוג לקוחה</label>
    <div class="chips" id="scope">
      <button class="chip on" data-v="all">הכול</button>
      <button class="chip" data-v="exist">לקוחה קיימת</button>
      <button class="chip" data-v="new">עדיין לא לקוחה</button>
    </div>
    <div class="hint">מסנן לפי סימון סוג הלקוחה בגיליון. תשובות ללא סימון מוצגות בכל הסינונים.</div>

    <label class="lbl" style="margin-top:16px">נושא (לא חובה)</label>
    <div class="chips" id="topic"></div>

    <label class="lbl" style="margin-top:16px">שם הלקוחה (לא חובה)</label>
    <input type="text" id="cname" placeholder="למשל דנה — ייכנס לפתיחה"/>

    <div class="row">
      <input type="text" id="q" placeholder="הקלידי את שאלת הלקוחה…" autocomplete="off" disabled/>
      <button class="btn" id="go" disabled>חיפוש</button>
    </div>
  </div>

  <div id="result"></div>

  <div class="notes-head">
    <div class="notes-title">הערות ל‑Ron <span class="count" id="ncount">0</span></div>
    <button class="btn soft" id="copyNotes">העתקת כל ההערות</button>
  </div>
  <div id="notes"></div>

  <small class="foot">MyPrime · מחובר לגיליון החי. מוצגות התשובות המאושרות בלבד.</small>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
