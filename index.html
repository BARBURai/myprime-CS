<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyPrime · שירות לקוחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">My<span>Prime</span> · שירות לקוחות</div>
      <div class="sub" id="sub">עוזר תשובות</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="sub">משיבה:
        <select id="responder" style="width:auto;display:inline-block;padding:5px 8px;font-size:13px"><option>טלי</option><option>שיר</option><option>אפי</option></select>
      </span>
      <button class="bell" id="bell" title="התראות">🔔<span class="c" id="bc" style="display:none">0</span></button>
    </div>
  </header>

  <div id="notifs" style="display:none"></div>

  <div class="panel">
    <label class="lbl">סוג לקוחה</label>
    <div class="chips" id="scope">
      <button class="chip on" data-v="all">לא ידוע</button>
      <button class="chip" data-v="לקוחה קיימת">לקוחה קיימת</button>
      <button class="chip" data-v="עדיין לא לקוחה">עדיין לא לקוחה</button>
    </div>
    <label class="lbl" style="margin-top:16px">שם הלקוחה (לא חובה)</label>
    <input type="text" id="cname" placeholder="ייכנס לפתיחה"/>
    <label class="lbl" style="margin-top:16px">הדביקי את ההודעה של הלקוחה</label>
    <textarea id="msg" placeholder="מה שהלקוחה כתבה, כמו שהוא…"></textarea>
    <div class="row"><button class="btn" id="go">קבלת תשובה</button></div>
  </div>

  <div id="result"></div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
