<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyPrime · שירות לקוחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#9B4A5E">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyPrime">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<!-- ===== מסך כניסה ===== -->
<div class="wrap" id="loginScreen">
  <div style="text-align:center;padding:38px 0 8px">
    <div class="brand" style="font-size:24px">My<span>Prime</span></div>
    <div class="sub">שירות לקוחות</div>
  </div>
  <div class="panel">
    <label class="lbl">מייל</label>
    <input type="text" id="lEmail" placeholder="הכתובת שרשומה במערכת" autocomplete="username"/>
    <label class="lbl" style="margin-top:14px">קוד אישי</label>
    <input type="text" id="lCode" placeholder="הקוד שקיבלת" autocomplete="current-password"/>
    <div class="row"><button class="btn" id="lGo" style="width:100%">כניסה</button></div>
    <div id="lErr" class="hint" style="color:var(--warn);display:none"></div>
  </div>
</div>

<!-- ===== האפליקציה ===== -->
<div class="wrap" id="app" style="display:none">
  <header>
    <div>
      <div class="brand">My<span>Prime</span> · שירות לקוחות</div>
      <div class="sub" id="sub"></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="bell" id="bell" title="התראות">🔔<span class="c" id="bc" style="display:none">0</span></button>
      <button class="btn soft" id="logout">יציאה</button>
    </div>
  </header>

  <div class="chips" id="tabs" style="margin-top:14px"></div>
  <div id="notifs" style="display:none"></div>

  <!-- לשונית העוזר -->
  <div id="tabAssist">
    <div class="panel">
      <label class="lbl">סוג לקוחה</label>
      <div class="chips" id="scope">
        <button class="chip on" data-v="all">לא ידוע</button>
        <button class="chip" data-v="לקוחה קיימת">לקוחה קיימת</button>
        <button class="chip" data-v="עדיין לא לקוחה">עדיין לא לקוחה</button>
      </div>
      <label class="lbl" style="margin-top:16px">שם הלקוחה (לא חובה)</label>
      <input type="text" id="cname" placeholder="ייכנס לפתיחה"/>
      <label class="lbl" style="margin-top:16px">הדביקי את ההודעה של הלקוחה</label>
      <textarea id="msg" placeholder="מה שהלקוחה כתבה, כמו שהוא…"></textarea>
      <div class="row"><button class="btn" id="go">קבלת תשובה</button></div>
    </div>
    <div id="result"></div>
  </div>

  <!-- לשונית אישורים -->
  <div id="tabApprove" style="display:none"><div id="queue"></div></div>

  <!-- לשונית מאגר התשובות -->
  <div id="tabBrowse" style="display:none">
    <div class="panel">
      <input type="text" id="bSearch" placeholder="חיפוש בשאלות ובתשובות…"/>
      <label class="lbl" style="margin-top:14px">קטגוריה</label>
      <div class="chips" id="bCat"></div>
      <label class="lbl" style="margin-top:14px">סוג לקוחה</label>
      <div class="chips" id="bType">
        <button class="chip on" data-v="">הכול</button>
        <button class="chip" data-v="לקוחה קיימת">לקוחה קיימת</button>
        <button class="chip" data-v="עדיין לא לקוחה">עדיין לא לקוחה</button>
        <button class="chip" data-v="שתיהן">שתיהן</button>
      </div>
      <div id="bStatusWrap" style="display:none">
        <label class="lbl" style="margin-top:14px">סטטוס</label>
        <div class="chips" id="bStatus">
          <button class="chip on" data-v="">הכול</button>
          <button class="chip" data-v="מאושר">מאושר</button>
          <button class="chip" data-v="ממתין לאישור">ממתין לאישור</button>
          <button class="chip" data-v="טיוטה">טיוטה</button>
          <button class="chip" data-v="הוחזר לטיפול">הוחזר לטיפול</button>
        </div>
      </div>
      <div class="hint" id="bCount" style="margin-top:12px"></div>
    </div>
    <div id="bList"></div>
  </div>

  <!-- לשונית הוספת תשובה (מנהל) -->
  <div id="tabAdd" style="display:none">
    <div class="panel">
      <div class="lbl">הוספת תשובה למאגר · נכנסת מיד כמאושרת</div>
      <label class="lbl" style="margin-top:10px">השאלה המרכזית</label>
      <input type="text" id="aQ" placeholder="איך הלקוחה שואלת את זה"/>
      <label class="lbl" style="margin-top:12px">ניסוחים חלופיים (מופרדים בפסיק)</label>
      <input type="text" id="aAlt" placeholder="עוד דרכים לשאול את אותו דבר"/>
      <label class="lbl" style="margin-top:12px">התשובה (גוף בלבד, בלי פתיחה וחתימה)</label>
      <textarea id="aBody" placeholder="הפתיחה והחתימה נוספות אוטומטית"></textarea>
      <label class="lbl" style="margin-top:12px">קטגוריה</label>
      <input type="text" id="aCat" placeholder="למשל מחיר ותשלומים"/>
      <label class="lbl" style="margin-top:12px">סוג לקוחה</label>
      <div class="chips" id="aCt">
        <button class="chip" data-v="לקוחה קיימת">לקוחה קיימת</button>
        <button class="chip" data-v="עדיין לא לקוחה">עדיין לא לקוחה</button>
        <button class="chip on" data-v="שתיהן">שתיהן</button>
      </div>
      <label class="lbl" style="margin-top:12px">סוג הרשומה</label>
      <div class="chips" id="aKind">
        <button class="chip on" data-v="מענה">מענה</button>
        <button class="chip" data-v="הודעה יזומה">הודעה יזומה</button>
      </div>
      <div class="row"><button class="btn" id="aSave">הוספה למאגר</button></div>
    </div>
  </div>

  <!-- לשונית משתמשים -->
  <div id="tabUsers" style="display:none">
    <div class="panel">
      <div class="lbl">הוספת משתמש</div>
      <input type="text" id="uName" placeholder="שם (יופיע בחתימה)"/>
      <input type="text" id="uEmail" placeholder="מייל" style="margin-top:8px"/>
      <input type="text" id="uCode" placeholder="קוד אישי (ריק = קוד אקראי)" style="margin-top:8px"/>
      <select id="uRole" style="margin-top:8px">
        <option>נציג</option><option>מנהלת שירות</option><option>מנהל</option>
      </select>
      <div class="row"><button class="btn" id="uAdd">הוספה</button></div>
    </div>
    <div id="usersList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
